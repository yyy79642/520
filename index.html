<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心海流光</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: black;
        }

        .banner {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .banner video {
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .love-text {
            position: relative;
            z-index: 2;
            font-size: 3.5em;
            font-weight: bold;
            color: #ff69b4;
            text-shadow: 0 0 15px #ff69b4, 0 0 35px #ff1493;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s ease;
            text-align: center;
        }

        .love-text.show {
            opacity: 1;
            transform: scale(1);
        }

        .love-text::after {
            content: 'LOVE YOU 雯宝';
            position: absolute;
            top: 0;
            left: 0;
            color: transparent;
            background-image: linear-gradient(to right,
                    #ff69b4, #ff1493, #ffc0cb, #ffffff,
                    #ff69b4, #ff1493);
            background-clip: text;
            -webkit-background-clip: text;
            clip-path: circle(100px at 0% 50%);
            animation: move 5s infinite;
        }

        @keyframes move {
            0% {
                clip-path: circle(100px at 0% 50%);
            }

            50% {
                clip-path: circle(100px at 100% 50%);
            }

            100% {
                clip-path: circle(100px at 0% 50%);
            }
        }

        .tip {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 3;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .tip.hide {
            display: none;
        }
    </style>
</head>

<body>
    <div class="banner" id="page">
        <video id="bgVideo" autoplay muted loop playsinline webkit-playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <div class="love-text" id="loveText">
            LOVE YOU 雯宝
        </div>
    </div>

    <div class="tip" id="tip">点击屏幕播放音乐</div>

    <audio id="music1" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        const page = document.getElementById('page');
        const music = document.getElementById('music1');
        const video = document.getElementById('bgVideo');
        const loveText = document.getElementById('loveText');
        const tip = document.getElementById('tip');

        page.addEventListener('click', function () {
            video.play();
            music.play();

            loveText.classList.add('show');
            tip.classList.add('hide');
        });
    </script>
</body>

</html>
